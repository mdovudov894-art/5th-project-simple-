<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Stats preview card component</title>

  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45, 44%); }
  </style>
</head>
<body>

  <div class="container">

    <!-- Қисми чап: Ҳамаи матнҳо ва омор дар инҷо -->
    <div class="card-left">
      <h1>Get <span>insights</span> that help you business grow.</h1>

      <p>Discover the benefits of data analytics and make<br> better decisions regarding revenue, customer<br> experience, and overall efficiency.</p>

      <!-- Блоки омор дар дохили card-left илова шуд -->
      <div class="omor">
        <div class="stat-item">
          <h2>10k+</h2>
          <p>COMPANIES</p>
        </div>
        <div class="stat-item">
          <h2>314</h2>
          <p>TEMPLATES</p>
        </div>
        <div class="stat-item">
          <h2>12M+</h2>
          <p>QUERIES</p>
        </div>
      </div>
    </div>

    <!-- Қисми рост: Танҳо акс -->
    <div class="img-card">
      <img src="images/image.jpg" alt="Stats preview">
    </div>

  </div>
  

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>

</body>
</html>
